services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ecommerce-api

    expose:
      - "5000"

    env_file:
      - .env

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: ecommerce-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

    restart: unless-stopped