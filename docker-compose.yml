services:
  backend:
    image: 250761481176.dkr.ecr.ap-south-1.amazonaws.com/ecommerce-backend:${IMAGE_TAG}

    container_name: ecommerce-api

    expose:
      - "5000"

    env_file:
      - .env

    restart: unless-stopped

  nginx:
    image: nginx:latest

    container_name: ecommerce-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

    restart: unless-stopped